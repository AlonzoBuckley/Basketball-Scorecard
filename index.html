<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <h3 class="team-score" id="home-score">0</h3>
                <button class="add-points" onclick=homeAdd1Point()>+1</button>
                <button class="add-points" onclick=homeAdd2Point()>+2</button>
                <button class="add-points" onclick=homeAdd3Point()>+3</button>
            </div>
            <div>
                <h3>GUEST</h3>
                <h3 class="team-score" id="guest-score">0</h3>
                <button class="add-points" onclick=guestAdd1Point()>+1</button>
                <button class="add-points" onclick=guestAdd2Point()>+2</button>
                <button class="add-points" onclick=guestAdd3Point()>+3</button>
            </div>
            <div>
                <button id="new-game" onclick=newGame()>New Game</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
